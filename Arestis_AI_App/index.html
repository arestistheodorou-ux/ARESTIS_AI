<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arestis AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050816;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    flex-direction:column;
    height:100vh;
}

.header{
    background:#0f172a;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#00d4ff;
}

.status{
    color:#00ff88;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:75%;
    padding:18px;
    border-radius:18px;
    margin-bottom:20px;
    line-height:1.6;
    white-space:pre-wrap;
}

.user{
    background:#2563eb;
    margin-left:auto;
}

.ai{
    background:#111827;
}

.input-area{
    background:#0f172a;
    padding:20px;
    display:flex;
    gap:15px;
}

.input-area input{
    flex:1;
    padding:18px;
    border:none;
    border-radius:15px;
    background:#111827;
    color:white;
    outline:none;
    font-size:16px;
}

.input-area button{
    border:none;
    border-radius:15px;
    padding:0 25px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.send-btn{
    background:#00d4ff;
    color:black;
}

.voice-btn{
    background:#7c3aed;
    color:white;
}

.features{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:10px;
    background:#020617;
}

.feature{
    background:#111827;
    padding:10px 15px;
    border-radius:10px;
    white-space:nowrap;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">Arestis AI</div>
    <div class="status">● ONLINE</div>
</div>

<div class="features">
    <div class="feature">AI Chat</div>
    <div class="feature">Voice Commands</div>
    <div class="feature">Website Builder</div>
    <div class="feature">Recipes</div>
    <div class="feature">Maps</div>
</div>

<div class="chat" id="chat">

<div class="message ai">
Hello.
I am Arestis.

Your advanced AI assistant.
</div>

</div>

<div class="input-area">

<input
id="input"
type="text"
placeholder="Ask Arestis anything..."
>

<button class="send-btn" onclick="sendMessage()">
Send
</button>

<button class="voice-btn" onclick="startVoice()">
🎤
</button>

</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text,type){

    const div = document.createElement("div");

    div.classList.add("message");
    div.classList.add(type);

    div.innerText = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

function speak(text){

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    speechSynthesis.speak(speech);
}

function aiReply(text){

    addMessage(text,"ai");

    speak(text);
}

function sendMessage(){

    const message = input.value.trim();

    if(message === "") return;

    addMessage(message,"user");

    processMessage(message);

    input.value = "";
}

function processMessage(message){

    const msg = message.toLowerCase();

    if(msg.includes("open youtube")){

        window.open("https://youtube.com","_blank");

        aiReply("Opening YouTube.");
    }

    else if(msg.includes("open google")){

        window.open("https://google.com","_blank");

        aiReply("Opening Google.");
    }

    else if(msg.includes("maps")){

        window.open("https://maps.google.com","_blank");

        aiReply("Opening Google Maps.");
    }

    else if(msg.includes("recipe")){

        aiReply("Recipe idea: creamy chicken pasta.");
    }

    else if(msg.includes("workout")){

        aiReply("Workout: pushups, squats, planks.");
    }

    else{

        aiReply("Advanced AI processing activated.");
    }
}

function startVoice(){

    if(!('webkitSpeechRecognition' in window)){

        alert("Voice recognition not supported.");

        return;
    }

    const recognition = new webkitSpeechRecognition();

    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event){

        const transcript = event.results[0][0].transcript;

        input.value = transcript;

        sendMessage();
    };
}

window.onload = () => {

    speak("Arestis AI system online.");
};

</script>

</body>
</html>
